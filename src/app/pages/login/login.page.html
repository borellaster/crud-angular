<div class="login-wrapper">
  <mat-card class="login-card">
    <h1>Login</h1>
    <p>Autenticacao fake para liberar o sistema.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" placeholder="Digite seu e-mail" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          placeholder="Digite sua senha"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="'Mostrar ou ocultar senha'"
          (click)="hidePassword = !hidePassword"
        >
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
      <button mat-flat-button color="primary" type="submit">Entrar</button>
    </form>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }
  </mat-card>
</div>
